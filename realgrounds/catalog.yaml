# Object knowledge for indoor training grounds (lab/toolkit/room.py).
#
# For every object type the detector can be asked for (the `prompt` words), this says what the
# object usually IS — so a detected box of pixels becomes an object with properties:
#
#   material      most likely material (an ESTIMATE from the class, marked as such in records)
#   state         static (furniture you don't move in normal use) | movable
#   affordances   what an agent can do with it
#   size_m        typical [width, depth, height] — completes the unseen back side and checks scale
#   mass_kg       typical mass (null = unknown)
#   support       true = other things can rest on its top surface (desk, bed, shelf, ...)
#   physics       hardness / friction 0..1 (same meaning as configs/materials.yaml)
#   scale_ref     true = its real size is very standard (door, desk height) -> used to check scale
#
# `prompt` = the words sent to the open-vocabulary detector (Grounding DINO).

objects:
  bed:            {prompt: "bed", material: "wood frame + fabric mattress", state: static, affordances: [sit, lie_down, place_on], size_m: [1.0, 2.0, 0.5], mass_kg: 60, support: true, physics: {hardness: 0.25, friction: 0.7}, hang_point: true, inner_surface: true, surface_m: 0.5, scale_ref: false}
  loft_bed:       {prompt: "loft bed", material: "wood frame + mattress", state: static, affordances: [climb_up, lie_down, sit_under, store_under], size_m: [1.0, 2.0, 1.7], mass_kg: 70, support: true, platform: true, physics: {hardness: 0.6, friction: 0.6}, hang_point: true, scale_ref: false}
  ladder:         {prompt: "ladder", material: "wood", state: static, affordances: [climb], size_m: [0.45, 0.1, 1.7], mass_kg: 6, support: false, physics: {hardness: 0.8, friction: 0.7}, hang_point: true, scale_ref: false}
  mattress:       {prompt: "mattress", material: "foam + fabric", state: movable, affordances: [lie_down, sit, lift], size_m: [0.9, 1.9, 0.18], mass_kg: 15, support: true, physics: {hardness: 0.15, friction: 0.8}, scale_ref: false}
  stuffed_toy:    {prompt: "stuffed toy", material: "plush fabric", state: movable, affordances: [grasp, lift, squeeze, throw, place], size_m: [0.3, 0.2, 0.25], mass_kg: 0.3, support: false, physics: {hardness: 0.03, friction: 0.8}, scale_ref: false}
  shoes:          {prompt: "shoes", material: "rubber + fabric", state: movable, affordances: [grasp, lift, wear, place], size_m: [0.12, 0.3, 0.12], mass_kg: 0.8, support: false, physics: {hardness: 0.5, friction: 0.9}, scale_ref: false}
  fan:            {prompt: "electric fan", material: "plastic", state: movable, affordances: [switch_on, switch_off, grasp, move], size_m: [0.25, 0.2, 0.3], mass_kg: 1.5, support: false, physics: {hardness: 0.7, friction: 0.6}, scale_ref: false}
  tote_bag:       {prompt: "tote bag", material: "fabric / rubber", state: movable, affordances: [grasp, lift, carry, hang, store], size_m: [0.35, 0.15, 0.3], mass_kg: 0.5, support: false, physics: {hardness: 0.2, friction: 0.7}, scale_ref: false}
  duffel_bag:     {prompt: "duffel bag", material: "fabric", state: movable, affordances: [grasp, lift, carry, open, store], size_m: [0.5, 0.3, 0.3], mass_kg: 1, support: false, physics: {hardness: 0.1, friction: 0.8}, scale_ref: false}
