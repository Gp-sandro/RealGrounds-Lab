  plastic_bag:    {prompt: "plastic bag", material: "plastic film", state: movable, affordances: [grasp, lift, carry, open], size_m: [0.4, 0.3, 0.3], mass_kg: 0.5, support: false, physics: {hardness: 0.02, friction: 0.6}, scale_ref: false}
